[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saeruq"
version = "0.2.0"
description = "Independent local image generation and editing runtime for MORUVIK"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
download = ["huggingface-hub==1.33.0"]
gpu = ["torch==2.14.1", "diffusers==0.41.0", "transformers==5.19.0", "accelerate==1.15.0", "huggingface-hub==1.33.0", "safetensors>=0.8,<1"]

[project.scripts]
saeruq = "saeruq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
